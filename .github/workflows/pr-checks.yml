# Checks every pull request to main, so "merge when CI is green" (git_workflow.md,
# "Who Merges") has something to check. See issue #4.
name: PR checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Same Jekyll build as the deploy workflow, without uploading or deploying.
  jekyll-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

  # Every CieloVista project reads project-registry.json; a bad JSON file must not merge.
  json-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse every tracked .json file
        shell: python
        run: |
          import json, subprocess, sys
          files = subprocess.run(["git", "ls-files", "*.json"], capture_output=True, text=True, check=True).stdout.split()
          failed = 0
          for path in files:
              try:
                  with open(path, encoding="utf-8-sig") as handle:
                      json.load(handle)
                  print(f"ok    {path}")
              except Exception as error:
                  failed += 1
                  print(f"::error file={path}::{error}")
          print(f"{len(files)} JSON files checked, {failed} failed")
          sys.exit(1 if failed else 0)
